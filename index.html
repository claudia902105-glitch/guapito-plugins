<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conteo — El Guapo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #707579);
    --sec: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --link: var(--tg-theme-link-color, #2481cc);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 12px 96px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 4px 0 12px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .meta { color: var(--hint); font-size: 13px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; margin-bottom: 8px;
    background: var(--sec); border-radius: 10px;
  }
  .row.pendiente { outline: 2px solid #e0a800; }
  .info { flex: 1; min-width: 0; }
  .nombre {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sku { color: var(--hint); font-size: 12px; }
  input[type=number] {
    width: 84px; padding: 10px; text-align: center;
    font-size: 17px; font-weight: 600;
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
    background: var(--bg); color: var(--fg);
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  input:focus { outline: 2px solid var(--link); border-color: transparent; }
  #aviso {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    padding: 12px; border-radius: 10px;
    background: #e0a800; color: #000; font-size: 14px; text-align: center;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo">Conteo</h1>
  <div class="meta" id="subtitulo"></div>
</header>

<div id="lista"></div>
<div id="aviso"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) {
    document.body.innerHTML = '<p style="padding:20px">Esta página solo funciona abierta desde Telegram.</p>';
    return;
  }
  tg.ready();
  tg.expand();

    // El bot arma la URL con ?d=<JSON percent-encoded>, así la lista de ítems
    // siempre sale de Airtable en el momento y esta página nunca queda desfasada.
    // Forma: {"t":"Conteo de Barra","s":"Diego · cierre · semana 2026-07-27","i":[{"k":"BAR-01","n":"LIMONADA"}]}
    function leerDatos() {
          var q = new URLSearchParams(location.search).get('d');
          if (!q) return null;
          return JSON.parse(q);
    }

  var datos;
  try {
    datos = leerDatos();
  } catch (e) {
    datos = null;
  }
  if (!datos || !Array.isArray(datos.i) || !datos.i.length) {
    document.body.innerHTML = '<p style="padding:20px">No se recibió la lista de ítems. Volvé a Telegram y escribí el comando de nuevo.</p>';
    return;
  }

  document.getElementById('titulo').textContent = datos.t || 'Conteo';
  document.getElementById('subtitulo').textContent = datos.s || '';

  var lista = document.getElementById('lista');
  var aviso = document.getElementById('aviso');

  datos.i.forEach(function (item, idx) {
    var row = document.createElement('div');
    row.className = 'row';
    row.dataset.idx = idx;

    var info = document.createElement('div');
    info.className = 'info';
    var nombre = document.createElement('div');
    nombre.className = 'nombre';
    nombre.textContent = item.n;
    var sku = document.createElement('div');
    sku.className = 'sku';
    sku.textContent = item.k;
    info.appendChild(nombre);
    info.appendChild(sku);

    var input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'decimal';
    input.min = '0';
    input.step = 'any';
    input.placeholder = '—';
    input.dataset.k = item.k;
    // Enter salta al siguiente campo en vez de cerrar el teclado.
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var todos = lista.querySelectorAll('input');
        if (todos[idx + 1]) todos[idx + 1].focus();
        else input.blur();
      }
    });
    input.addEventListener('input', revisar);

    row.appendChild(info);
    row.appendChild(input);
    lista.appendChild(row);
  });

  var inputs = Array.prototype.slice.call(lista.querySelectorAll('input'));

  // Nada se envía a medias: el botón solo se habilita con los N ítems llenos.
  // Un conteo incompleto que llegue a Airtable se lee como "había 0", y eso
  // dispara una alerta falsa de faltante.
  function revisar() {
    var faltan = inputs.filter(function (i) { return i.value.trim() === ''; });
    inputs.forEach(function (i) {
      i.parentElement.classList.toggle('pendiente', i.value.trim() === '');
    });
    if (faltan.length) {
      tg.MainButton.hide();
      aviso.style.display = 'block';
      aviso.textContent = 'Faltan ' + faltan.length + ' de ' + inputs.length + ' ítems';
    } else {
      aviso.style.display = 'none';
      tg.MainButton.setText('Enviar conteo (' + inputs.length + ' ítems)');
      tg.MainButton.show();
    }
  }

  tg.MainButton.onClick(function () {
    var payload = {
      f: datos.f || 'conteo',
      t: datos.t || '',
      s: datos.s || '',
      v: inputs.map(function (i) {
        return { k: i.dataset.k, q: Number(i.value) };
      })
    };
    var texto = JSON.stringify(payload);
    // sendData tiene tope de 4096 bytes. Con 18 ítems sobra, pero si algún día
    // una lista crece, mejor un error claro que un envío truncado en silencio.
    if (new Blob([texto]).size > 4000) {
      tg.showAlert('La lista es demasiado larga para enviarse de una. Avisale a Claudia.');
      return;
    }
    tg.sendData(texto);
  });

  revisar();
})();
</script>
</body>
</html>
