<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conteo — El Guapo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #707579);
    --sec: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --link: var(--tg-theme-link-color, #2481cc);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 12px 96px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 4px 0 12px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .meta { color: var(--hint); font-size: 13px; }
  h2 {
    margin: 20px 0 8px; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; color: var(--hint);
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; margin-bottom: 8px;
    background: var(--sec); border-radius: 10px;
  }
  .row.pendiente { outline: 2px solid #e0a800; }
  .row.malo { outline: 2px solid #d64545; }
  .info { flex: 1; min-width: 0; }
  .nombre {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sku { color: var(--hint); font-size: 12px; }
  /* Qué unidad se está contando. Barra y Cocina van en unidades, Rellenos
     en gramos, y sin esto las tres pantallas se veían iguales. */
  .banda-unidad {
    margin-top: 8px; padding: 7px 10px; border-radius: 8px;
    background: var(--sec); color: var(--fg);
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .banda-unidad em { font-style: normal; text-transform: uppercase; letter-spacing: .04em; }
  .ayuda { color: var(--hint); font-size: 12px; margin-top: 2px; }
  input[type=number], input[type=text] {
    width: 84px; padding: 10px; text-align: center;
    font-size: 17px; font-weight: 600;
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
    background: var(--bg); color: var(--fg);
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  input:focus { outline: 2px solid var(--link); border-color: transparent; }
  .par { display: flex; gap: 6px; }
  .par label { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .par span { font-size: 10px; color: var(--hint); text-transform: uppercase; }
  .par input { width: 72px; }
  .calc {
    padding: 10px 12px; margin-bottom: 8px;
    border-radius: 10px; background: var(--sec);
    font-size: 13px; color: var(--hint);
  }
  .calc b { color: var(--fg); font-weight: 600; }
  /* Rendimiento en vivo dentro de la fila: se ve mientras se escribe, para
     cazar el dedazo antes de mandar. No se envía — lo recalcula Airtable. */
  .rend { font-size: 12px; margin-top: 2px; color: var(--link); }
  /* Límite de producción esperado para el ítem. Informa, no bloquea: el bot
     solo captura (D3) y una producción fuera de rango es justo la que hay que
     poder registrar. */
  .lim { font-size: 12px; margin-top: 2px; color: var(--hint); }
  .lim.bien { color: #2e9e4f; }
  .lim.mal  { color: #d33; font-weight: 600; }
  /* Selector de motivo (Menú 5 · Fruver). Son dos opciones excluyentes y van
     como botones a la vista, no como lista desplegable: un <select> en
     Telegram abre la rueda nativa del sistema, que tapa media pantalla y
     encima llega con la primera opción ya elegida. */
  .opciones { display: flex; gap: 8px; margin-bottom: 8px; }
  .opciones.pendiente { outline: 2px solid #e0a800; border-radius: 12px; }
  .chip {
    flex: 1; padding: 12px 8px; border-radius: 10px;
    background: var(--sec); color: var(--fg);
    border: 2px solid transparent;
    font-size: 15px; font-weight: 600; text-align: center;
    cursor: pointer; user-select: none;
  }
  .chip.puesto { border-color: var(--link); }
  .chip .ayuda { font-weight: 400; margin-top: 2px; }
  #aviso {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    padding: 12px; border-radius: 10px;
    background: #e0a800; color: #000; font-size: 14px; text-align: center;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo">Conteo</h1>
  <div class="meta" id="subtitulo"></div>
</header>

<div id="cuerpo"></div>
<div id="aviso"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) {
    document.body.innerHTML = '<p style="padding:20px">Esta página solo funciona abierta desde Telegram.</p>';
    return;
  }
  tg.ready();
  tg.expand();

  // El bot arma la URL con ?d=<JSON>, así los catálogos salen de Airtable en el
  // momento y esta página nunca queda desfasada.
  //
  //   tipo "conteo"  (por defecto) → {"t","s","i":[{"k","n"}]}
  //     /barra, /produccion Existencia, /rellenos Existencia
  //     + opcional {"rec":1,"u":"g"} → segunda columna de recetas y rendimiento
  //       en vivo; lo usan producción de panadería (Menú 3) y de rellenos (Menú 4)
  //   tipo "proteina" (Menú 2)     → {"t","s","p":"A"|"B"|"C","r":[{"k","n"}]}
  //     p = perfil de la proteína (ver PERFILES); r = recetas destino, solo B y C
  //   tipo "receta"   (Menú 1)     → {"t","s","u":"g","lim":{"est","min","max"}}
  //     una sola preparación, ya elegida en el chat: recetas + cantidad
  //   tipo "fruver"   (Menú 5)     → {"t","s","tope":500}
  //     una sola fruta o verdura: motivo + peso inicial + peso final
  //
  // `lim` (opcional, en el ítem o en la raíz) es el límite de producción
  // ESPERADO POR UNA RECETA, sacado de la tabla `Rendimientos y tolerancias`.
  // No todos los ítems tienen fila cargada; sin `lim` no se dibuja nada.
  //
  // URLSearchParams ya hace el percent-decode. Si eso no da JSON válido se
  // reintenta como base64url, para no romper si algún día el bot cambia de
  // codificación.
  function leerDatos() {
    var q = new URLSearchParams(location.search).get('d');
    if (!q) return null;
    try {
      return JSON.parse(q);
    } catch (e) {
      var b64 = q.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    }
  }

  var datos;
  try {
    datos = leerDatos();
  } catch (e) {
    datos = null;
  }
  if (!datos) {
    document.body.innerHTML = '<p style="padding:20px">No se recibieron los datos. Volvé a Telegram y escribí el comando de nuevo.</p>';
    return;
  }

  document.getElementById('titulo').textContent = datos.t || 'Conteo';
  document.getElementById('subtitulo').textContent = datos.s || '';

  // Rótulo de unidad, arriba de todo. `u` es "g" o "und"; sin `u` no se dibuja
  // nada y la página queda exactamente como antes.
  var UNIDADES = {
    g:   { corta: 'g',   larga: 'gramos' },
    und: { corta: 'und', larga: 'unidades' },
  };
  var uni = UNIDADES[datos.u] || null;
  if (uni) {
    var banda = document.createElement('div');
    banda.className = 'banda-unidad';
    banda.innerHTML = 'Todas las cantidades en <em>' + uni.larga + '</em>';
    document.querySelector('header').appendChild(banda);
  }

  // Abierto como link suelto (no desde el botón azul del mensaje) el botón de
  // enviar de la mini-app NO existe y el envío es imposible. Avisarlo de una,
  // antes de que alguien llene 25 casillas para nada.
  if (!tg.initData) {
    var fuera = document.createElement('div');
    fuera.style.cssText = 'margin:12px;padding:12px;border-radius:10px;' +
      'background:#e0a800;color:#000;font-size:14px;text-align:center;';
    fuera.textContent = 'Ojo: abriste esto como link y así NO se puede enviar. ' +
      'Volvé a Telegram y abrí el formulario tocando el botón del mensaje.';
    document.body.insertBefore(fuera, document.getElementById('cuerpo'));
  }

  var cuerpo = document.getElementById('cuerpo');
  var aviso = document.getElementById('aviso');
  var tipo = datos.tipo || 'conteo';

  // Dos parseos distintos, y la diferencia importa:
  //   - Las CANTIDADES llevan separador de miles, así que "10.000" son diez mil
  //     y hay que sacarle los puntos antes de convertir.
  //   - El Nº DE RECETAS no lo lleva: ahí el punto (o la coma) es el separador
  //     decimal de 0,5. Sacarle los puntos convertiría media receta en cinco.
  // El input se marca con `_miles` cuando pasó por conSeparadorDeMiles().
  function num(input) {
    var v = input.value.trim();
    if (v === '') return null;
    if (input._miles) return Number(v.replace(/\./g, '').replace(/\s/g, ''));
    return Number(v.replace(',', '.'));
  }

  // Un número con punto de miles: 10000 -> "10.000". Para mostrar, no para leer.
  function miles(n) {
    if (n === null || n === undefined || isNaN(n)) return '';
    var s = String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (n < 0 ? '-' : '') + s;
  }

  // Separador de miles mientras se escribe (26-ago-2026, pedido de Claudia).
  // El problema real: el personal escribe 1000 y no distingue a simple vista
  // 1000 de 10000, así que un cero de más entra sin que nadie lo note. Con el
  // punto puesto en vivo, "10.000" salta a la vista.
  //
  // Pasa el campo a type=text (un input numérico no puede mostrar puntos) e
  // impone enteros: gramos, unidades y porciones no llevan decimales.
  // NUNCA aplicar esto al nº de recetas.
  function conSeparadorDeMiles(input) {
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input._miles = true;

    function pintar() {
      var sel = input.selectionStart;
      var antes = input.value;
      // Cuántos dígitos había antes del cursor: es lo que hay que respetar al
      // reponerlo, porque los puntos se mueven solos.
      var digitosAntes = antes.slice(0, sel === null ? antes.length : sel)
                              .replace(/[^0-9]/g, '').length;
      var crudo = antes.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
      var nuevo = crudo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      if (nuevo === antes) return;
      input.value = nuevo;
      var pos = 0, vistos = 0;
      while (pos < nuevo.length && vistos < digitosAntes) {
        if (nuevo.charAt(pos) >= '0' && nuevo.charAt(pos) <= '9') vistos++;
        pos++;
      }
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    }

    input.addEventListener('input', pintar);
    input.addEventListener('blur', pintar);
    return input;
  }

  // --------------------------------------------------------- límites (`lim`)
  // `lim` viene por ítem y SIEMPRE está expresado por UNA receta:
  // {est, min, max}. La página lo escala por el nº de recetas cargado —
  // comparar un total de 5 recetas contra un límite de una es exactamente el
  // error que estos límites existen para evitar.
  //
  // Sale de la tabla `Rendimientos y tolerancias` de Airtable. No todos los
  // ítems tienen fila, así que `lim` es opcional: sin él no se dibuja nada.
  function textoLimite(lim, unidad) {
    if (!lim || !(lim.est > 0)) return '';
    var u = unidad ? ' ' + unidad : '';
    var rango = (lim.min > 0 && lim.max > 0)
      ? ' · rango ' + miles(lim.min) + '–' + miles(lim.max) + u
      : '';
    return 'Esperado ' + miles(lim.est) + u + ' por receta' + rango;
  }

  // Devuelve null cuando todavía no hay con qué comparar. Nunca bloquea el
  // envío: avisa. Una tanda fuera de rango es un dato, no un error de carga.
  function veredictoLimite(lim, q, r, unidad) {
    if (!lim || !(lim.min > 0) || !(lim.max > 0) || !(q > 0) || !(r > 0)) return null;
    var porReceta = q / r;
    var u = unidad ? ' ' + unidad : '';
    var cuanto = miles(porReceta) + u + ' por receta';
    if (porReceta < lim.min) {
      return { ok: false, txt: '\u26a0\ufe0f ' + cuanto + ' — por DEBAJO del mínimo (' + miles(lim.min) + u + ')' };
    }
    if (porReceta > lim.max) {
      return { ok: false, txt: '\u26a0\ufe0f ' + cuanto + ' — por ENCIMA del máximo (' + miles(lim.max) + u + ')' };
    }
    return { ok: true, txt: '\u2705 ' + cuanto + ' — dentro del rango' };
  }

  function enviar(payload) {
    var texto = JSON.stringify(payload);
    // sendData tiene tope de 4096 bytes. Mejor un error claro que un envío
    // truncado en silencio.
    if (new Blob([texto]).size > 4000) {
      tg.showAlert('El formulario es demasiado largo para enviarse de una. Avisale a Claudia.');
      return;
    }
    tg.sendData(texto);
  }

  function titulo(texto) {
    var h = document.createElement('h2');
    h.textContent = texto;
    cuerpo.appendChild(h);
  }

  // Fila con un solo campo numérico. Devuelve el input.
  //
  // `sinMiles` lo saca del formateo de miles y lo deja como número decimal:
  // es para el nº de recetas, el único campo del formulario que admite 0,5 y
  // donde el punto sería el separador decimal, no el de miles.
  function filaSimple(nombre, sub, ayuda, marcador, sinMiles) {
    var row = document.createElement('div');
    row.className = 'row';
    var info = document.createElement('div');
    info.className = 'info';
    var n = document.createElement('div');
    n.className = 'nombre';
    n.textContent = nombre;
    info.appendChild(n);
    if (sub) {
      var s = document.createElement('div');
      s.className = 'sku';
      s.textContent = sub;
      info.appendChild(s);
    }
    if (ayuda) {
      var a = document.createElement('div');
      a.className = 'ayuda';
      a.textContent = ayuda;
      info.appendChild(a);
    }
    var input = document.createElement('input');
    input.placeholder = marcador || '—';
    if (sinMiles) {
      input.type = 'number';
      input.inputMode = 'decimal';
      input.min = '0.01';
      input.step = '0.01';
    } else {
      // Por defecto filaSimple dibuja una CANTIDAD (pesos, porciones):
      // separador de miles y enteros.
      conSeparadorDeMiles(input);
    }
    row.appendChild(info);
    row.appendChild(input);
    cuerpo.appendChild(row);
    input._row = row;
    return input;
  }

  /* ---------------------------------------------------------------- conteo */
  // Lista de ítems con una cantidad cada uno. Es el flujo de /barra y el que
  // reusan Existencia, panadería y rellenos.
  //
  // Con `rec: 1` en el JSON aparece una segunda columna, "recetas", y debajo del
  // nombre el rendimiento en vivo (cantidad ÷ recetas). Es opcional a propósito:
  // /barra y Existencia cuentan lo que hay, no lo que se hizo, y no mandan `rec`
  // — para ellos esta función se comporta exactamente igual que antes.
  //
  // Las recetas ADMITEN FRACCIONES: 0,5 es media receta y 1,5 receta y media.
  // La cantidad no — los gramos y las unidades siguen siendo enteros. La
  // fracción va en el divisor, nunca en lo producido.
  //
  // `u` es la unidad de la cantidad ("g" o "und") y solo se usa para rotular.
  function modoConteo() {
    if (!Array.isArray(datos.i) || !datos.i.length) {
      document.body.innerHTML = '<p style="padding:20px">No se recibió la lista de ítems. Volvé a Telegram y escribí el comando de nuevo.</p>';
      return;
    }

    var conRecetas = !!datos.rec;
    var unidad = datos.u || '';

    var filas = datos.i.map(function (item) {
      return conRecetas ? filaConRecetas(item, unidad) : filaSola(item, unidad);
    });

    // Todos los campos en orden de tabulación, para que Enter avance.
    var orden = [];
    filas.forEach(function (f) {
      orden.push(f.cant);
      if (f.rec) orden.push(f.rec);
    });
    orden.forEach(function (input, idx) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (orden[idx + 1]) orden[idx + 1].focus();
          else input.blur();
        }
      });
      input.addEventListener('input', revisar);
    });

    // Nada se envía a medias: el botón solo se habilita con los N ítems llenos.
    // Un conteo incompleto que llegue a Airtable se lee como "había 0", y eso
    // dispara una alerta falsa de faltante.
    //
    // Las recetas son la excepción: solo se exigen en los ítems que de verdad se
    // produjeron. Pedir "cuántas recetas" de algo que salió en 0 es ruido, y
    // obligaría a llenar 8 campos para reportar un solo sabor.
    function revisar() {
      var faltan = 0;

      filas.forEach(function (f) {
        var vacia = f.cant.value.trim() === '';
        // num(), NO Number(): la casilla trae separador de miles y
        // Number("10.000") daría 10. Ese fue el punto de todo el cambio.
        var q = vacia ? null : num(f.cant);
        var produjo = q > 0;

        if (vacia) faltan++;
        f.cant._row.classList.toggle('pendiente', vacia);

        if (!f.rec) return;

        // Un ítem en cero no se produjo: la casilla de recetas se apaga y se
        // limpia, así no queda un número viejo colgado de un dedazo corregido.
        f.rec.disabled = !produjo;
        f.rec.style.opacity = produjo ? '' : '.35';
        if (!produjo && f.rec.value !== '') f.rec.value = '';

        var r = num(f.rec);
        if (produjo && !(r > 0)) faltan++;

        f.rend.textContent = (produjo && r > 0)
          ? '→ ' + redondear(q / r) + (unidad ? ' ' + unidad : '') + ' por receta'
          : '';

        // El límite se evalúa contra el rendimiento POR RECETA, no contra el
        // total. Avisa en color, nunca bloquea el envío: una tanda fuera de
        // rango es justo la que hay que poder registrar.
        if (f.lim) {
          var v = veredictoLimite(f.tope, q, r, unidad);
          f.lim.className = 'lim' + (v ? (v.ok ? ' bien' : ' mal') : '');
          f.lim.textContent = v ? v.txt : textoLimite(f.tope, unidad);
        }
      });

      if (faltan) {
        tg.MainButton.hide();
        aviso.style.display = 'block';
        aviso.textContent = 'Faltan ' + faltan + ' dato' + (faltan === 1 ? '' : 's');
      } else {
        aviso.style.display = 'none';
        tg.MainButton.setText(datos.btn || ('Enviar (' + filas.length + ' ítems)'));
        tg.MainButton.show();
      }
    }

    tg.MainButton.onClick(function () {
      enviar({
        f: datos.f || 'conteo',
        tipo: 'conteo',
        t: datos.t || '',
        s: datos.s || '',
        v: filas.map(function (f) {
          var fila = { k: f.k, q: num(f.cant) };
          // `r` solo viaja cuando hubo producción: el bot distingue "no aplica"
          // de "cero recetas" por la ausencia de la clave, no por un 0.
          if (f.rec && fila.q > 0) fila.r = num(f.rec);
          return fila;
        })
      });
    });

    revisar();
  }

  // Un decimal, y sin el ",0" cuando es redondo. Lleva punto de miles y coma
  // decimal, igual que las casillas donde se escribe (26-ago-2026): antes esto
  // devolvía `String(n)` pelado, así que en el mismo renglón podía leerse
  // "→ 5000 g por receta · Esperado 4.800 g" — el separador puesto para hacer
  // visible un cero de más faltaba justo en el número calculado.
  function redondear(n) {
    if (n === null || n === undefined || isNaN(n)) return '';
    var r = Math.round(n * 10) / 10;
    var ent = Math.floor(Math.abs(r));
    var dec = Math.round((Math.abs(r) - ent) * 10);
    var s = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    if (dec) s += ',' + dec;
    return (r < 0 ? '-' : '') + s;
  }

  // Fila de una sola cantidad — el conteo de toda la vida.
  //
  // La unidad va de marcador dentro de la casilla ("g" / "und"). Es el único
  // lugar donde cabe sin ensuciar una lista de 25 ítems, y se ve justo cuando
  // hace falta: al ir a escribir el número.
  function filaSola(item, unidad) {
    var marcador = UNIDADES[unidad] ? UNIDADES[unidad].corta : '';
    var input = filaSimple(item.n, item.k, '', marcador);
    return { k: item.k, cant: input, rec: null, rend: null };
  }

  // Fila con cantidad + recetas + el rendimiento debajo del nombre.
  function filaConRecetas(item, unidad) {
    var row = document.createElement('div');
    row.className = 'row';

    var info = document.createElement('div');
    info.className = 'info';
    var n = document.createElement('div');
    n.className = 'nombre';
    n.textContent = item.n;
    var s = document.createElement('div');
    s.className = 'sku';
    s.textContent = item.k;
    var rend = document.createElement('div');
    rend.className = 'rend';
    info.appendChild(n);
    info.appendChild(s);
    info.appendChild(rend);

    var par = document.createElement('div');
    par.className = 'par';
    var cant = campoRotulado(par, unidad || 'cantidad');
    // Fracciones de receta (26-ago-2026, pedido de Alicia): campoRotulado deja
    // este campo en step 0,01 y sin separador de miles. Antes era step=1/min=1
    // y el navegador rechazaba 0,5 antes de que el dato saliera del teléfono.
    var rec = campoRotulado(par, 'recetas');

    // Límite de producción del ítem, si Airtable tiene tolerancia cargada.
    var lim = null;
    if (item.lim && item.lim.est > 0) {
      lim = document.createElement('div');
      lim.className = 'lim';
      lim.textContent = textoLimite(item.lim, unidad);
      info.appendChild(lim);
    }

    row.appendChild(info);
    row.appendChild(par);
    cuerpo.appendChild(row);

    cant._row = row;
    return { k: item.k, cant: cant, rec: rec, rend: rend, lim: lim, tope: item.lim || null };
  }

  function campoRotulado(par, rotulo) {
    var label = document.createElement('label');
    var span = document.createElement('span');
    span.textContent = rotulo;
    var input = document.createElement('input');
    input.placeholder = '—';
    // 'recetas' es el ÚNICO campo que no lleva separador de miles: admite
    // fracciones (0,5) y ahí el punto es el separador decimal, no de miles.
    if (rotulo === 'recetas') {
      input.type = 'number';
      input.inputMode = 'decimal';
      input.min = '0.01';
      input.step = '0.01';
    } else {
      conSeparadorDeMiles(input);
    }
    label.appendChild(span);
    label.appendChild(input);
    par.appendChild(label);
    return input;
  }

  /* -------------------------------------------------------------- proteína */
  // Menú 2. No todas las proteínas se trabajan igual (Alicia, 2-ago-2026), así
  // que hay tres perfiles y cada uno pide solo lo que de verdad se mide. Pedir
  // un peso que nadie toma es peor que no pedirlo: se llena con un número
  // inventado y ensucia las mermas.
  //
  //   A · entera            crudo → limpio → porciones.       Sin reparto.
  //   B · porcionada cruda  crudo → limpio → reparto.          Sin cocción.
  //   C · porcionada cocida crudo → limpio → cocido → aprovechable → reparto.
  //
  // El perfil llega en `p`. Si no viene, se asume C, que es el más completo —
  // así un formulario viejo sigue comportándose como antes.
  var PERFILES = {
    A: { cocido: false, aprov: false, porcSuelta: true,  reparto: false },
    B: { cocido: false, aprov: false, porcSuelta: false, reparto: true  },
    C: { cocido: true,  aprov: true,  porcSuelta: false, reparto: true  }
  };

  function modoProteina() {
    var perfil = PERFILES[datos.p] || PERFILES.C;

    // Nº de recetas (26-ago-2026, pedido de Claudia). El Menú 2 no lo tenía:
    // una pieza de carne no se produce "por receta", y en las ~110 filas
    // históricas de este menú el campo está vacío. Se agregó porque se pidió
    // poder registrarlo en los tres menús de producción, y va OPCIONAL a
    // propósito — exigirlo bloquearía a quien trabaje una pieza que no
    // responde a una receta.
    titulo('Receta');
    var recetas = filaSimple('Nº de recetas', 'opcional',
                             'Admite fracciones: 0,5 es media receta', '—', true);

    titulo('Pesos');
    var crudo  = filaSimple('Peso inicial crudo', 'gramos', 'Como llega la pieza');
    var limpio = filaSimple('Peso limpio', 'gramos', 'Después de quitar grasa y recortes');
    var cocido = perfil.cocido
      ? filaSimple('Peso cocido', 'gramos', 'Después de la cocción')
      : null;
    // El rótulo dice "Merma" a secas desde el 26-ago-2026 (pedido de Claudia).
    // La clave del payload sigue siendo `aprov` y el campo de Airtable sigue
    // llamándose "Merma aprovechable": cambió el término que ve el personal,
    // no el dato. En Airtable ya hay "Merma de limpieza", "de cocción" y "de
    // porcionamiento", y una columna suelta llamada "Merma" se confundiría.
    var aprov = perfil.aprov
      ? filaSimple('Merma', 'gramos', 'Opcional: recortes que se aprovechan')
      : null;

    var porc = null;
    if (perfil.porcSuelta) {
      titulo('Porciones');
      porc = filaSimple('Porciones resultantes', 'unidades');
    }

    var resumen = document.createElement('div');
    resumen.className = 'calc';
    cuerpo.appendChild(resumen);

    var filas = [];
    if (perfil.reparto) {
      titulo('Distribución entre recetas');
      var recetas = Array.isArray(datos.r) ? datos.r : [];
      filas = recetas.map(function (r) {
        var row = document.createElement('div');
        row.className = 'row';
        var info = document.createElement('div');
        info.className = 'info';
        var n = document.createElement('div');
        n.className = 'nombre';
        n.textContent = r.n;
        var s = document.createElement('div');
        s.className = 'sku';
        s.textContent = r.k;
        info.appendChild(n);
        info.appendChild(s);

        var par = document.createElement('div');
        par.className = 'par';
        var g = campoRotulado(par, 'gramos');
        var p = campoRotulado(par, 'porciones');

        row.appendChild(info);
        row.appendChild(par);
        cuerpo.appendChild(row);
        return { k: r.k, row: row, g: g, p: p };
      });
    }

    var todos = [recetas, crudo, limpio, cocido, aprov, porc].filter(Boolean).concat(
      filas.map(function (f) { return f.g; }),
      filas.map(function (f) { return f.p; })
    );
    todos.forEach(function (i) { i.addEventListener('input', revisar); });

    function revisar() {
      var vCrudo = num(crudo), vLimpio = num(limpio);
      var vCocido = cocido ? num(cocido) : null;
      var vAprov = aprov ? num(aprov) : null;
      var vPorc = porc ? num(porc) : null;
      var problemas = [];

      // Obligatorios: los que este perfil sí mide.
      var obligatorios = [{ i: crudo, n: 'Falta el peso inicial crudo' },
                          { i: limpio, n: 'Falta el peso limpio' }];
      if (cocido) obligatorios.push({ i: cocido, n: 'Falta el peso cocido' });
      if (porc)   obligatorios.push({ i: porc, n: 'Faltan las porciones resultantes' });
      obligatorios.forEach(function (o) {
        var vacio = num(o.i) === null;
        o.i._row.classList.toggle('pendiente', vacio);
        if (vacio) problemas.push(o.n);
      });

      // La cadena de pesos solo puede ir hacia abajo. Un peso que sube es un
      // error de digitación, y si entra así arruina las mermas.
      var cadena = [
        { i: crudo,  v: vCrudo,  n: 'crudo' },
        { i: limpio, v: vLimpio, n: 'limpio' },
        { i: cocido, v: vCocido, n: 'cocido' }
      ].filter(function (x) { return x.i && x.v !== null; });

      cadena.forEach(function (x) { x.i._row.classList.remove('malo'); });
      for (var j = 1; j < cadena.length; j++) {
        if (cadena[j].v > cadena[j - 1].v) {
          cadena[j].i._row.classList.add('malo');
          problemas.push('El peso ' + cadena[j].n + ' no puede ser mayor que el ' + cadena[j - 1].n);
        }
      }

      // Lo que queda disponible para repartir: lo cocido si se cocinó, si no lo limpio.
      var base = vCocido !== null ? vCocido : vLimpio;

      var sumaG = 0, sumaP = 0, conDato = 0;
      filas.forEach(function (f) {
        var g = num(f.g), p = num(f.p);
        if (g !== null) { sumaG += g; conDato++; }
        if (p !== null) sumaP += p;
        f.row.classList.toggle('pendiente', (g === null) !== (p === null));
        if ((g === null) !== (p === null)) {
          problemas.push('Completá gramos y porciones en ' + f.k);
        }
      });
      if (perfil.reparto && !conDato) {
        problemas.push('Falta repartir la pieza entre al menos una receta');
      }

      var lineas = [];
      if (vCrudo !== null && vLimpio !== null) {
        lineas.push('Merma de limpieza: <b>' + miles(vCrudo - vLimpio) + ' g</b>');
      }
      if (vLimpio !== null && vCocido !== null) {
        lineas.push('Merma de cocción: <b>' + miles(vLimpio - vCocido) + ' g</b>');
      }
      if (perfil.reparto && base !== null) {
        var falta = base - sumaG;
        lineas.push('Repartido: <b>' + miles(sumaG) + ' de ' + miles(base) + ' g</b>' +
          (Math.abs(falta) < 1 ? ' ✓' : (falta > 0 ? ' — faltan ' + miles(falta) + ' g' : ' — sobran ' + miles(-falta) + ' g')));
        if (sumaG > base) problemas.push('Estás repartiendo más de lo que quedó');
      }
      if (vCrudo) {
        var salida = perfil.reparto ? sumaG : vLimpio;
        if (salida) lineas.push('Rendimiento: <b>' + redondear(salida / vCrudo * 100) + '%</b>');
      }
      var totalPorc = perfil.porcSuelta ? vPorc : sumaP;
      if (totalPorc) {
        var pesoUtil = perfil.reparto ? sumaG : vLimpio;
        if (pesoUtil) lineas.push('Gramos por porción: <b>' + miles(pesoUtil / totalPorc) + ' g</b>');
        if (!perfil.porcSuelta) lineas.push('Porciones: <b>' + miles(totalPorc) + '</b>');
      }
      // La merma sale de lo que NO se repartió: no puede ser mayor.
      if (aprov) {
        var sobrante = base !== null ? base - sumaG : null;
        var excede = vAprov !== null && sobrante !== null && vAprov > sobrante;
        aprov._row.classList.toggle('malo', !!excede);
        if (excede) problemas.push('La merma no puede superar lo que quedó sin repartir');
      }
      resumen.innerHTML = lineas.join(' · ') || 'Cargá los pesos para ver las mermas.';

      if (problemas.length) {
        tg.MainButton.hide();
        aviso.style.display = 'block';
        aviso.textContent = problemas[0];
      } else {
        aviso.style.display = 'none';
        tg.MainButton.setText(datos.btn || 'Enviar producción');
        tg.MainButton.show();
      }
    }

    tg.MainButton.onClick(function () {
      var pesos = { crudo: num(crudo), limpio: num(limpio) };
      if (cocido) pesos.cocido = num(cocido);
      if (aprov)  pesos.aprov  = num(aprov);
      if (porc)   pesos.porc   = num(porc);

      var salida = {
        f: datos.f || 'prod-prot',
        tipo: 'proteina',
        p: datos.p || 'C',
        t: datos.t || '',
        s: datos.s || '',
        w: pesos
      };
      // `rec` solo viaja si se cargó. Su ausencia significa "no aplica",
      // nunca "cero recetas".
      var vRec = num(recetas);
      if (vRec > 0) salida.rec = vRec;
      // `d` solo viaja en los perfiles que reparten. Su ausencia significa
      // "esta pieza no se distribuye", no "se distribuyó en cero".
      if (perfil.reparto) {
        salida.d = filas.filter(function (f) { return num(f.g) !== null; })
                        .map(function (f) { return { k: f.k, g: num(f.g), p: num(f.p) }; });
      }
      enviar(salida);
    });

    revisar();
  }

  /* ---------------------------------------------------------------- receta */
  // Menú 1 — salsas, aceites y mayonesas. UNA sola preparación, ya elegida en
  // el chat: acá se cargan las recetas y los gramos, y se ve el límite.
  //
  // Por qué no es un formulario con las 37 preparaciones como Panadería: no
  // entra. Medido el 26-ago-2026, la URL con las 37 da 2.217 caracteres contra
  // el tope de 2.048 de Telegram, incluso comprimida en base64. Y además casi
  // nunca se hacen más de una o dos salsas en la misma tanda.
  //
  //   {"tipo":"receta","t":"SRIRACHA","s":"PRE-086 · Alicia","u":"g",
  //    "lim":{"est":530,"min":450,"max":610}}
  // devuelve
  //   {"f":"prod-salsas","tipo":"receta","r":0.5,"q":265}
  function modoReceta() {
    var unidad = datos.u || 'g';
    var uCorta = UNIDADES[unidad] ? UNIDADES[unidad].corta : unidad;
    var uLarga = UNIDADES[unidad] ? UNIDADES[unidad].larga : 'cantidad';

    titulo('Producción');
    var rec = filaSimple('Nº de recetas', 'admite fracciones',
                         'Media receta se escribe 0,5 y receta y media 1,5',
                         '—', true);
    var cant = filaSimple('Cantidad producida', uLarga,
                          'El total de la tanda, no lo de una receta', uCorta);

    var resumen = document.createElement('div');
    resumen.className = 'calc';
    cuerpo.appendChild(resumen);

    [rec, cant].forEach(function (i) { i.addEventListener('input', revisar); });

    function revisar() {
      var r = num(rec), q = num(cant);
      var problemas = [];

      rec._row.classList.toggle('pendiente', !(r > 0));
      cant._row.classList.toggle('pendiente', !(q > 0));
      if (!(r > 0)) problemas.push('Falta el nº de recetas');
      if (!(q > 0)) problemas.push('Falta la cantidad producida');

      var lineas = [];
      if (r > 0 && q > 0) {
        lineas.push('Rendimiento: <b>' + redondear(q / r) + ' ' + uCorta + ' por receta</b>');
      }
      var base = textoLimite(datos.lim, uCorta);
      if (base) {
        var v = veredictoLimite(datos.lim, q, r, uCorta);
        lineas.push(v ? v.txt : base);
      }
      resumen.innerHTML = lineas.join('<br>') ||
        'Cargá las recetas y la cantidad para ver el rendimiento.';

      if (problemas.length) {
        tg.MainButton.hide();
        aviso.style.display = 'block';
        aviso.textContent = problemas[0];
      } else {
        // Fuera de rango NO bloquea: el bot solo captura (D3) y una tanda
        // desviada es justo la que hay que poder registrar. El aviso queda a
        // la vista en el resumen, en rojo.
        aviso.style.display = 'none';
        tg.MainButton.setText(datos.btn || 'Registrar producción');
        tg.MainButton.show();
      }
    }

    tg.MainButton.onClick(function () {
      enviar({
        f: datos.f || 'prod-salsas',
        tipo: 'receta',
        t: datos.t || '',
        s: datos.s || '',
        r: num(rec),
        q: num(cant)
      });
    });

    revisar();
  }

  /* ---------------------------------------------------------------- fruver */
  // Menú 5 — merma de frutas y verduras (27-ago-2026, pedido de Claudia).
  //
  // Es la forma del Menú 2 recortada a dos pesos: entran 12 kg de cebolla,
  // salen 9,5 kg limpios, y los 2,5 kg de diferencia son la merma. Lo que se
  // quería ver es el PORCENTAJE: 500 g botados no dicen nada hasta saber si
  // salieron de 2 kg (25%) o de 20 kg (2,5%), y el porcentaje es lo único que
  // hace comparable una cebolla con una piña.
  //
  //   {"tipo":"fruver","t":"CEBOLLA CABEZONA BLANCA PELADA",
  //    "s":"070055 · Alicia","tope":500}
  // devuelve
  //   {"f":"prod-fruver","tipo":"fruver","m":"Limpieza","ini":12000,"fin":9500}
  //
  // El motivo va PRIMERO y arranca sin elegir. Preseleccionar "Limpieza"
  // haría que el daño —el único de los dos que hay que ir a reclamarle al
  // proveedor— se registre como merma normal cada vez que alguien manda sin
  // mirar, y el dato que se quería separar quedaría enterrado.
  var MOTIVOS_MERMA = [
    { v: 'Limpieza', ayuda: 'Cáscara, tallos, semillas' },
    { v: 'Daño',     ayuda: 'Partes podridas o inservibles' }
  ];

  // Regla de Claudia (27-ago-2026): una limpieza no debería botar más de
  // 500 g. Viaja en `tope` para poder cambiarla desde el bot sin tocar esta
  // página; el valor de acá es solo el piso si el formulario llega sin él.
  var TOPE_MERMA = 500;

  function modoFruver() {
    var tope = datos.tope > 0 ? datos.tope : TOPE_MERMA;

    titulo('Motivo');
    var caja = document.createElement('div');
    caja.className = 'opciones';
    var motivo = null;
    var chips = MOTIVOS_MERMA.map(function (m) {
      var b = document.createElement('div');
      b.className = 'chip';
      var quien = document.createElement('div');
      quien.textContent = m.v;
      var ayuda = document.createElement('div');
      ayuda.className = 'ayuda';
      ayuda.textContent = m.ayuda;
      b.appendChild(quien);
      b.appendChild(ayuda);
      b.addEventListener('click', function () {
        motivo = m.v;
        chips.forEach(function (c) { c.classList.remove('puesto'); });
        b.classList.add('puesto');
        revisar();
      });
      caja.appendChild(b);
      return b;
    });
    cuerpo.appendChild(caja);

    titulo('Pesos');
    var ini = filaSimple('Peso inicial', 'gramos', 'Como llega, antes de limpiar');
    var fin = filaSimple('Peso final', 'gramos', 'Lo que queda aprovechable');

    var resumen = document.createElement('div');
    resumen.className = 'calc';
    cuerpo.appendChild(resumen);

    [ini, fin].forEach(function (i) { i.addEventListener('input', revisar); });

    function revisar() {
      var vIni = num(ini), vFin = num(fin);
      var problemas = [];

      caja.classList.toggle('pendiente', !motivo);
      if (!motivo) problemas.push('Falta el motivo: limpieza o daño');

      // El peso final SÍ puede ser cero —una caja entera podrida es cero
      // aprovechable— así que se pregunta si está vacío, no si es mayor que
      // cero. El inicial no: cero no es un peso, es una casilla sin llenar.
      ini._row.classList.toggle('pendiente', !(vIni > 0));
      fin._row.classList.toggle('pendiente', vFin === null);
      if (!(vIni > 0)) problemas.push('Falta el peso inicial');
      if (vFin === null) problemas.push('Falta el peso final');

      // Un final mayor que el inicial es un dedazo. Si entra así la merma
      // sale negativa y arruina el promedio del ítem para siempre.
      var sube = vIni !== null && vFin !== null && vFin > vIni;
      fin._row.classList.toggle('malo', sube);
      if (sube) problemas.push('El peso final no puede ser mayor que el inicial');

      var lineas = [];
      if (vIni > 0 && vFin !== null && !sube) {
        var merma = vIni - vFin;
        lineas.push('Merma: <b>' + miles(merma) + ' g</b> — <b>' +
                    redondear(merma / vIni * 100) + '%</b> del peso inicial');
        lineas.push(merma > tope
          ? '⚠️ Se pasa del tope de ' + miles(tope) + ' g'
          : '✅ Dentro del tope de ' + miles(tope) + ' g');
      }
      resumen.innerHTML = lineas.join('<br>') ||
        'Elegí el motivo y cargá los dos pesos para ver la merma.';

      if (problemas.length) {
        tg.MainButton.hide();
        aviso.style.display = 'block';
        aviso.textContent = problemas[0];
      } else {
        // Pasarse del tope AVISA, no bloquea — la misma regla que los límites
        // de producción (D3). La tanda que se fue de merma es justo la que hay
        // que poder registrar; si el formulario la rechaza, no se registra
        // nada y el problema queda invisible, que es lo contrario de lo que
        // se buscaba.
        aviso.style.display = 'none';
        tg.MainButton.setText(datos.btn || 'Registrar merma');
        tg.MainButton.show();
      }
    }

    tg.MainButton.onClick(function () {
      enviar({
        f: datos.f || 'prod-fruver',
        tipo: 'fruver',
        t: datos.t || '',
        s: datos.s || '',
        m: motivo,
        ini: num(ini),
        fin: num(fin)
      });
    });

    revisar();
  }

  if (tipo === 'proteina') modoProteina();
  else if (tipo === 'receta') modoReceta();
  else if (tipo === 'fruver') modoFruver();
  else modoConteo();
})();
</script>
</body>
</html>
